version: 1
container:
  port: 8080
healthcheck:
  path: /healthz
# 編輯後台的內容、上傳的圖片、回饋存在這裡（Dockerfile 的 DATA_DIR）。
# 不能用 /app/data：那是程式附的文章資料夾，掛上去會蓋掉
persistence:
  enabled: true
  mount_path: /app/storage
# 只有編輯後台要登入，說明中心不用（網站自己處理公司帳號登入，見 server/editor.js）
auth:
  mode: oidc
  callback_path: /api/auth/callback/authentik
# 執行時需要的設定，只寫名稱。值放在負責人電腦上專案根目錄的 .env（不進 git），
# 部署時由 mason 的 deploy-site 交給平台。用途見 server/notify.js（收到回饋時用 Zulip 通知負責人）
environment:
  required:
    - ZULIP_SITE
    - ZULIP_BOT_EMAIL
    - ZULIP_API_KEY
    - FEEDBACK_NOTIFY_EMAIL
