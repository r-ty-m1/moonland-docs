<script>
  // 在畫面繪製前套用使用者上次選的明暗模式與目錄狀態，避免閃爍
  try {
    var t = localStorage.getItem('ml-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    var f = localStorage.getItem('ml-fs');
    if (f === '1' || f === '2') document.documentElement.dataset.fs = f;
    if (localStorage.getItem('ml-nav') === '1') document.documentElement.classList.add('nav-collapsed');
  } catch (e) {}
</script>
